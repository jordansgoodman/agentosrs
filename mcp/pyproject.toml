[project]
name = "lostcity-agent-mcp"
version = "0.1.0"
description = "FastMCP tools that expose the Lost City TypeScript Agent API"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12,<4",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
